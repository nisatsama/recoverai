      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Revenue bars -->
    <rect x="20" y="18" width="4" height="10" rx="2" fill="#6366F1"/>
    <rect x="26" y="13" width="4" height="15" rx="2" fill="#3B82F6"/>
    <rect x="32" y="7" width="4" height="21" rx="2" fill="#06B6D4"/>
  </g>

  <!-- Wordmark -->
  <text
    x="55"
    y="34"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700"
